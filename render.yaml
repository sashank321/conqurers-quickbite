services:
  - type: web
    name: hotbite-backend
    env: node
    buildCommand: cd backend && npm install && npx prisma generate
    startCommand: cd backend && npx prisma db push --accept-data-loss && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        value: https://hotbite-reborn.vercel.app # Update this with your frontend URL later
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # Set this in the Render dashboard to your Supabase PostgreSQL connection string!
